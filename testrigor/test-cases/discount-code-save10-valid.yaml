customSteps: |
  // ── Test: Apply valid SAVE10 discount code ──────────────────────────────
  // Acceptance Criteria: AC1, AC2, AC3 (case-insensitive)
  // - Cart page has discount code field with Apply button
  // - SAVE10 takes 10% off the subtotal
  // - Codes are case-insensitive

  reset to home
  enter stored value "checkoutProductName" into "Search"
  enter enter into "Search"
  click stored value "checkoutProductName"
  check that page contains stored value from "checkoutProductName"
  click "Add to Cart"
  check that "Cart" contains "1"

  click "Cart"

  // Verify discount code field exists (AC1)
  check that page contains "Discount code"
  check that page contains "Apply"

  // Apply SAVE10 code (AC2)
  enter stored value "discountCodeSave10" into "discount code"
  click "Apply"

  // Verify 10% discount is applied
  grab value from "Discount" and save it as "discountLine"
  check that stored value "discountLine" contains "10% off"
  check that stored value "discountLine" contains "SAVE10"

  // Verify discount amount is shown as negative
  check that page contains "-$"

  // Verify totals are updated
  check that page contains "Total"

labels: [discount, cart, checkout]
